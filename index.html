<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em có thích anh không?</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 420px;
            width: 90%;
            position: relative;
            z-index: 10;
        }
        h1 { color: #e91e63; margin-bottom: 20px; font-size: 22px; line-height: 1.4; }
        
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }
        .btn-yes { background: #e91e63; color: white; }
        .btn-yes:hover { transform: scale(1.05); background: #d81b60; }
        .btn-no { background: #757575; color: white; }
        .btn-no:hover { transform: scale(1.05); background: #616161; }

        .form-group { margin-top: 20px; display: none; }
        input[type="text"] {
            width: 100%; padding: 12px; border: 1px solid #ccc;
            border-radius: 8px; margin-bottom: 12px; font-size: 15px;
        }
        .status-msg { margin-top: 10px; font-weight: bold; font-size: 14px; }
        
        .sad-icon {
            font-size: 70px;
            margin: 15px 0;
            animation: shake 0.6s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .retry-btn {
            margin-top: 15px;
            background: #ff9800;
            font-size: 15px;
            padding: 8px 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="question">Em có nhớ a ko? ❤️</h1>
        
        <div class="btn-container" id="btnGroup">
            <button class="btn-yes" onclick="selectYes()">CÓ! 🥰</button>
            <button class="btn-no" onclick="selectNo()">KHÔNG 🥺</button>
        </div>

        <div class="form-group" id="messageForm">
            <p style="margin-bottom: 12px; color: #333; font-weight: 500;">em có muốn đi đâu chơi với a ko::</p>
            <input type="text" id="userNote" placeholder="Ví dụ: Có chứ, đi ăn lẩu/xem phim nha!...">
            <button class="btn-yes" onclick="sendToOracle('CÓ')" style="width: 100%;">Gửi cho anh 🚀</button>
            <div class="status-msg" id="statusMsg"></div>
        </div>

        <div class="form-group" id="sadContainer">
            <div class="sad-icon">😭</div>
            <p style="color: #555; font-size: 16px; margin-bottom: 10px;">Huhu... Anh buồn lắm luôn đó 💔</p>
            <button class="retry-btn btn-yes" onclick="resetForm()">Chọn lại nha ❤️</button>
            <div class="status-msg" id="sadStatusMsg"></div>
        </div>
    </div>

    <script>
        const ORDS_API_URL = "https://oracleapex.com/ords/wksp_apexlegend/loves/response";

        function selectYes() {
            document.getElementById('question').innerText = "Em có muốn đi đâu chơi với anh không? 🥰";
            document.getElementById('btnGroup').style.display = 'none';
            document.getElementById('messageForm').style.display = 'block';
            document.getElementById('sadContainer').style.display = 'none';
        }

        function selectNo() {
            document.getElementById('question').innerText = "Anh buồn lắm đó...";
            document.getElementById('btnGroup').style.display = 'none';
            document.getElementById('messageForm').style.display = 'none';
            document.getElementById('sadContainer').style.display = 'block';

            sendToOracle('KHÔNG', 'Em chọn KHÔNG rồi 😭');
        }
        function resetForm() {
            document.getElementById('question').innerText = "Em có thích anh không? ❤️";
            document.getElementById('btnGroup').style.display = 'flex';
            document.getElementById('messageForm').style.display = 'none';
            document.getElementById('sadContainer').style.display = 'none';
        }
        async function sendToOracle(answerType, customNote = null) {
            const noteText = customNote || document.getElementById('userNote').value;
            const statusMsg = (answerType === 'CÓ') ? document.getElementById('statusMsg') : document.getElementById('sadStatusMsg');

            if (statusMsg) {
                statusMsg.style.color = "#2196F3";
                statusMsg.innerText = "Đang gửi về Server...";
            }

            const payload = {
                answer: answerType,
                note: noteText || "Không có lời nhắn",
                user_agent: navigator.userAgent
            };

            try {
                const response = await fetch(ORDS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    if (statusMsg) {
                        statusMsg.style.color = "#4CAF50";
                        statusMsg.innerText = (answerType === 'CÓ') ? "✨ Đã gửi tin nhắn cho anh thành công!" : "(Đã ghi nhận câu trả lời)";
                    }
                } else {
                    if (statusMsg) {
                        statusMsg.style.color = "#f44336";
                        statusMsg.innerText = "Lỗi khi gửi (Status: " + response.status + ")";
                    }
                }
            } catch (err) {
                console.error(err);
                if (statusMsg) {
                    statusMsg.style.color = "#f44336";
                    statusMsg.innerText = "Lỗi kết nối API Oracle!";
                }
            }
        }
    </script>
</body>
</html>
