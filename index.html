<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em có thích anh không?</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 10;
        }
        h1 { color: #e91e63; margin-bottom: 20px; font-size: 24px; }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            min-height: 50px;
            position: relative;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }
        .btn-yes { background: #e91e63; color: white; }
        .btn-yes:hover { transform: scale(1.1); background: #d81b60; }
        .btn-no { background: #757575; color: white; position: absolute; }
        
        .form-group { margin-top: 15px; display: none; }
        input[type="text"] {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 8px; margin-bottom: 10px; font-size: 14px;
        }
        .status-msg { margin-top: 10px; font-weight: bold; color: #4caf50; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="question">Em có thích anh không? ❤️</h1>
        
        <div class="btn-container" id="btnGroup">
            <button class="btn-yes" onclick="selectYes()">CÓ! 🥰</button>
            <button class="btn-no" id="btnNo" onmouseover="moveButton()" onclick="moveButton()">Không 😜</button>
        </div>

        <!-- Khung gửi lời nhắn khi chọn CÓ -->
        <div class="form-group" id="messageForm">
            <p style="margin-bottom: 10px; color: #333;">Nhập lời nhắn nhỏ gửi cho anh nè:</p>
            <input type="text" id="userNote" placeholder="Ví dụ: Tối nay đi ăn lẩu nhé!...">
            <button class="btn-yes" onclick="sendToOracle()" style="width: 100%;">Gửi về Server 🚀</button>
            <div class="status-msg" id="statusMsg"></div>
        </div>
    </div>

    <script>
        // Thay đường dẫn REST API ORDS của bạn vào đây
        const ORDS_API_URL = "https://YOUR_APEX_DOMAIN/ords/app/love/response";

        // Nút KHÔNG di chuyển ngẫu nhiên khi rê chuột tới gần
        function moveButton() {
            const btnNo = document.getElementById('btnNo');
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 50);
            btnNo.style.fixed = 'fixed';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        }

        function selectYes() {
            document.getElementById('question').innerText = "Anh biết mà! Dễ thương quá đi ❤️";
            document.getElementById('btnGroup').style.display = 'none';
            document.getElementById('messageForm').style.display = 'block';
        }

        // Hàm gửi dữ liệu về Oracle APEX Server bằng Fetch API
        async function sendToOracle() {
            const noteText = document.getElementById('userNote').value;
            const statusMsg = document.getElementById('statusMsg');
            
            statusMsg.style.color = "#2196F3";
            statusMsg.innerText = "Đang gửi dữ liệu về Oracle Database...";

            const payload = {
                answer: "CÓ",
                note: noteText || "Không có lời nhắn",
                user_agent: navigator.userAgent
            };

            try {
                const response = await fetch(ORDS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    statusMsg.style.color = "#4CAF50";
                    statusMsg.innerText = "✨ Đã gửi câu trả lời về máy chủ Oracle thành công!";
                } else {
                    statusMsg.style.color = "#f44336";
                    statusMsg.innerText = "Lỗi khi gửi (Status: " + response.status + ")";
                }
            } catch (err) {
                console.error(err);
                statusMsg.style.color = "#f44336";
                statusMsg.innerText = "Lỗi kết nối API! Kiểm tra lại URL ORDS hoặc CORS.";
            }
        }
    </script>
</body>
</html>
